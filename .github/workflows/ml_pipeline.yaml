# Practical Task: ML Model CI/CD Pipeline

# Scenario: You have developed a Scikit-learn model to predict employee salaries. Create a basic automated CI/CD workflow using GitHub Actions.

# Dataset: Use the built-in `load_diabetes()` dataset from Scikit-learn.

# Tasks:

# 1. Model Training: Create a Python script (`train.py`) to train a Linear Regression model and save it as `model.pkl` using Joblib.

# 2. Model Versioning: Save the model with a version number (e.g., `model_v1.pkl`) and maintain a record of its training date and evaluation metric.

# 3. CI/CD Pipeline: Create `.github/workflows/ml_pipeline.yml` to automatically execute the following steps whenever code is pushed to GitHub:

# - Install dependencies.
# - Execute model training.
# - Run a basic model validation test.

# 4. Model Deployment: Create a simple FastAPI endpoint `/predict` that loads the saved model and returns predictions.

# 5. Monitoring & Logging: Log prediction requests and prediction results using Python's built-in `logging` module.

# Expected Deliverables:

# - `train.py`
# - `app.py`
# - `model.pkl`
# - `requirements.txt`
# - `.github/workflows/ml_pipeline.yml`

# Constraint: Focus on a working basic implementation. No need to configure actual cloud deployment, Prometheus, or Grafana.


# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' 
  

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name : 1.action checkout 
      uses: actions/checkout@v4
    - name: 2.Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: 3.Install dependencies
      run: pip install -r requirements.txt;
    - name: 4.train
      run: python src/train.py
    # - name: Test with pytest
    #   run: |
    #     pytest
